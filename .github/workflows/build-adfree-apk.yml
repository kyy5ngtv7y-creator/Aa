name: Build ad-free APK

on:
  push:
    branches:
      - claude/remove-google-ads-apk-n1a01v
    paths-ignore:
      - '**.md'
      - '**.MD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Google-Services config
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "Using google-services.json from repository secret."
            echo "${GOOGLE_SERVICES// /}" | base64 -d > composeApp/google-services.json
          else
            echo "::warning::No GOOGLE_SERVICES_BASE64 secret set - using a placeholder."
            echo "::warning::The APK will build and install, but cannot load any content."
            cat > composeApp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mimasu-placeholder",
              "storage_bucket": "mimasu-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "dev.datlag.mimasu"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Create Sekret config
        env:
          YAML: ${{ secrets.SEKRET_YAML_BASE64 }}
        run: |
          if [ -n "$YAML" ]; then
            echo "${YAML// /}" | base64 -d > composeApp/sekret.yaml
          else
            echo "{}" > composeApp/sekret.yaml
          fi

      - name: Generate Sekret sources
        run: ./gradlew composeApp:generateSekret --stacktrace

      - name: Build Sekret native binaries
        run: ./gradlew composeApp:createAndCopySekretNativeBinary --stacktrace

      - name: Build debug APK
        run: ./gradlew composeApp:assembleDebug --stacktrace
        env:
          # TMDB key baked into the build so the app shows content without a
          # Firebase project. A repository secret overrides this literal value.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'a705cb078d8b503259cbad8396755c4b' }}

      - name: Show built APKs
        run: find composeApp/build/outputs -name "*.apk" -print -exec ls -lh {} \;

      - name: Verify APK is ad-free and carries the TMDB key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || 'a705cb078d8b503259cbad8396755c4b' }}
        run: |
          APK=$(find composeApp/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Inspecting $APK"
          mkdir -p /tmp/apkcheck && unzip -o -q "$APK" -d /tmp/apkcheck

          echo "--- ad SDK classes ---"
          if unzip -l "$APK" | grep -qiE "com/google/android/gms/ads|com/jet/ads|com/google/android/ump"; then
            echo "FAIL: ad SDK classes present in the APK"
            exit 1
          fi
          if cat /tmp/apkcheck/classes*.dex | strings | grep -qiE "com\.google\.android\.gms\.ads|com\.jet\.ads|admob"; then
            echo "FAIL: ad SDK references found in dex"
            exit 1
          fi
          echo "OK: no advertising SDK in the APK"

          echo "--- TMDB key ---"
          if cat /tmp/apkcheck/classes*.dex | strings | grep -qF "$TMDB_API_KEY"; then
            echo "OK: TMDB key is baked into the APK"
          else
            echo "FAIL: TMDB key missing from the APK"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mimasu-adfree-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
