name: Tawakkul zu GitHub Pages

on:
  push:
    branches:
      - claude/islamic-trust-app-iphone-l7e73d
    paths:
      - 'tawakkul-app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tawakkul-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./tawakkul-app
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Tawakkul-App aktualisieren'
